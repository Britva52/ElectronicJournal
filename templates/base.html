<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный журнал</title>
    <!-- Подключаем Bootstrap для красоты -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Шапка сайта -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Электронный Журнал</a>
            <div class="d-flex text-white">
                {% if user.is_authenticated %}
                    <span class="me-3 mt-1">Привет, {{ user.username }} ({{ user.get_role_display }})</span>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-light">Выйти</button>
                    </form>
                {% else %}
                    <span>Вы не вошли в систему</span>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Основной контент страницы -->
    <div class="container">
        {% block content %}
        <!-- Сюда будут вставляться другие страницы -->
        {% endblock %}
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
