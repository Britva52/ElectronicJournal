{% extends 'base.html' %}

{% block content %}
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h2 class="m-0">Учебные группы</h2>
        </div>
        <div class="card-body">
            {% if groups %}
                <ul class="list-group">
                    {% for group in groups %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ group.name }}
                            <a href="#" class="btn btn-sm btn-outline-primary">Посмотреть журнал</a>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p class="text-muted">Группы пока не добавлены. Зайдите в админку и создайте группу.</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
