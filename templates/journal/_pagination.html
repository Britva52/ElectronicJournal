{% if page.has_other_pages %}<nav aria-label="Страницы" class="mt-3"><div class="d-flex gap-3 align-items-center">{% if page.has_previous %}<a href="?q={{ query|urlencode }}&page={{ page.previous_page_number }}">Назад</a>{% endif %}<span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?q={{ query|urlencode }}&page={{ page.next_page_number }}">Далее</a>{% endif %}</div></nav>{% endif %}
