{% extends 'base.html' %}{% block content %}<h1 class="mb-4">Новости</h1>{% for item in page %}<article class="card mb-3"><div class="card-body"><small class="text-muted">{{ item.published_at|date:'d.m.Y H:i' }}</small><h2 class="h5 mt-2"><a href="{% url 'journal:news_detail' item.pk %}">{{ item.title }}</a></h2><p>{{ item.content|truncatewords:35 }}</p></div></article>{% empty %}<p>Новостей пока нет.</p>{% endfor %}{% include 'journal/_pagination.html' %}{% endblock %}
